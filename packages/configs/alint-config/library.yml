version: 1
extends:
  - ./base.yml
rules:
  - id: exact-dependency-versions
    kind: json_path_matches
    paths: ['**/package.json']
    path: '$.devDependencies.*'
    matches: '^\d+\.\d+\.\d+$'
    policy_url: 'https://github.com/Elnop/brutalway/tree/main/packages/configs/alint-config#pin-the-dependencies'
    level: error
